name: Pre-Release

on:
  workflow_dispatch:

env:
  PYTHONUTF8: 1
  PYTHONFAULTHANDLER: 1
  PYTHON_VERSION: 3.11
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 24
  JAVA_VERSION: 21
  GO_VERSION: "^1.25.0"
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_SDK_VERSION: 21

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

jobs:
  test_ubuntu_gcc:
    name: Ubuntu (GCC 13)
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Pull Git submodules
        run: git submodule update --init --recursive
        # C/C++
      - name: Build C/C++
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential libjemalloc-dev libomp-dev
          cmake -B build_artifacts -D CMAKE_BUILD_TYPE=RelWithDebInfo -D USEARCH_BUILD_TEST_CPP=1 -D USEARCH_BUILD_TEST_C=1 -D USEARCH_BUILD_LIB_C=1 -D USEARCH_BUILD_SQLITE=1 -D USEARCH_USE_OPENMP=1 -D USEARCH_USE_NUMKONG=1 -D USEARCH_USE_JEMALLOC=1
          cmake --build build_artifacts --config RelWithDebInfo
      - name: Test C++
        run: build_artifacts/test_cpp
      - name: Test C
        run: build_artifacts/test_c
        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-repeat numpy numba cppyy

          python -m pip install .
      - name: Test Python
        run: pytest
        # JavaScript
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --skip-scripts
      - name: Build JavaScript
        run: npm run build-js
      - name: Test JavaScript
        run: npm test
        # Rust
      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
          rustc -vV
      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test
        # Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "adopt"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Check Java formatting
        run: gradle spotlessCheck
      - name: Test Java
        run: gradle clean build
        # C#
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          cp "${{ github.workspace }}/build_artifacts/libusearch_c.so" "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          cp "${{ github.workspace }}/build_artifacts/numkong/libnumkong.so" "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          dotnet test -c Debug --logger "console;verbosity=detailed"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp
        # GoLang
        # With `LD_DEBUG=all` we detect the addresses of the libraries that are loaded
      - name: Test GoLang
        run: |
          sudo cp ${{ github.workspace }}/build_artifacts/libusearch_c.so /usr/lib/libusearch_c.so
          sudo cp ${{ github.workspace }}/c/usearch.h /usr/include/usearch.h
          LD_DEBUG=all go test -v
        working-directory: ${{ github.workspace }}/golang/

  test_ubuntu_clang:
    name: Ubuntu (Clang 20)
    runs-on: ubuntu-24.04
    env:
      CC: clang-20
      CXX: clang++-20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Pull Git submodules
        run: git submodule update --init --recursive
        # C/C++
      - name: Build C/C++
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential libjemalloc-dev clang-20
          cmake -B build_artifacts -D CMAKE_BUILD_TYPE=RelWithDebInfo -D USEARCH_BUILD_TEST_CPP=1 -D USEARCH_BUILD_TEST_C=1 -D USEARCH_BUILD_LIB_C=1 -D USEARCH_BUILD_SQLITE=1 -D USEARCH_USE_OPENMP=0 -D USEARCH_USE_NUMKONG=1 -D USEARCH_USE_JEMALLOC=1
          cmake --build build_artifacts --config RelWithDebInfo
      - name: Test C++
        run: build_artifacts/test_cpp
      - name: Test C
        run: build_artifacts/test_c
        # JavaScript
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --skip-scripts
      - name: Build JavaScript
        run: npm run build-js
      - name: Test JavaScript
        run: npm test
        # Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-repeat numpy numba cppyy

          python -m pip install .
      - name: Test Python
        run: pytest
        # Rust
      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustc -vV
      - name: Build Rust
        run: cargo build
      - name: Test Rust
        run: cargo test
        # C#
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test .NET
        run: |
          mkdir -p "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          cp "${{ github.workspace }}/build_artifacts/libusearch_c.so" "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          cp "${{ github.workspace }}/build_artifacts/numkong/libnumkong.so" "${{ github.workspace }}/csharp/lib/runtimes/linux-x64/native"
          dotnet test -c Debug --logger "console;verbosity=detailed"
        shell: bash
        working-directory: ${{ github.workspace }}/csharp

  build_wheels_linux:
    name: Build Python Wheels (Linux)
    runs-on: ubuntu-24.04
    needs: [test_ubuntu_gcc, test_ubuntu_clang]
    strategy:
      matrix:
        python-version: ["311", "312", "313", "314", "314t", "315", "315t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
      - name: Install cibuildwheel
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 180
          command: python -m pip install "cibuildwheel~=4.3.1"
      - name: Build wheels
        uses: nick-fields/retry@v4
        with:
          max_attempts: 2
          retry_wait_seconds: 30
          timeout_minutes: 180
          command: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_PLATFORM: linux

